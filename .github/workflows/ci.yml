name: CI/CD Pipeline

on:
  push:
    branches:
      - prod
      - main
      - master
      - develop
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - prod
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  deploy:
    name: Deploy to Production Server
    needs: build
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST || '46.224.48.155' }}
      SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
      SERVER_SSH_KEY: ${{ secrets.Geo || secrets.GEO || secrets.SERVER_SSH_KEY || secrets.SSH_KEY }}
      SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}

    steps:
      - name: Verify Deployment Configuration
        run: |
          if [ -z "${SERVER_SSH_KEY}" ]; then
            echo "::error::SSH Key secret is missing. Please ensure SERVER_SSH_KEY or Geo secret is configured in GitHub repository secrets (https://github.com/${{ github.repository }}/settings/secrets/actions)."
            exit 1
          fi
          echo "Deployment target: ${SERVER_USER}@${SERVER_HOST}:${SERVER_PORT}"
          echo "SSH key is present and configured."

      - name: Execute deployment on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || '46.224.48.155' }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.Geo || secrets.GEO || secrets.SERVER_SSH_KEY || secrets.SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            /root/geo/deploy.sh
