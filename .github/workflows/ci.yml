name: CI/CD Pipeline

on:
  push:
    branches:
      - prod
      - main
      - master
      - develop
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - prod
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  deploy:
    name: Deploy to Production Server
    needs: build
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}

    steps:
      - name: Verify Deployment Secrets
        run: |
          MISSING=()
          [ -z "${SERVER_HOST}" ] && MISSING+=("SERVER_HOST")
          [ -z "${SERVER_USER}" ] && MISSING+=("SERVER_USER")
          [ -z "${SERVER_SSH_KEY}" ] && MISSING+=("SERVER_SSH_KEY")
          
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Deployment cannot proceed. The following required secrets are not configured in repository secrets: ${MISSING[*]}"
            echo "Please go to https://github.com/${{ github.repository }}/settings/secrets/actions and add:"
            for secret in "${MISSING[@]}"; do
              echo "  - $secret"
            done
            exit 1
          fi

      - name: Execute deployment on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            /root/geo/deploy.sh
